# A Béri Olvasókör könyvlistája.
# A sorrend itt határozza meg a kezdőlap sorrendjét.
#
# Mezők:
#   title          – a könyv magyar címe (kötelező)
#   author         – a szerző neve (kötelező)
#   originalTitle  – eredeti cím (opcionális, segít a keresésben)
#   wiki           – kézi felülírás, ha az automatikus keresés rossz cikket talál:
#                    Wikidata azonosító (pl. Q478016) vagy "hu:Cikk címe" / "en:Article title"
#   englishTitle   – angol fordítás címe (opcionális, borítókereséshez, ha nincs magyar borító)
#   cover          – saját borítókép a covers/ mappából (pl. covers/vilagitotorony.jpg)
#   coverSource    – a saját borító forrása: { name, url }
#   description    – saját összefoglaló bekezdések (csak ha nincs Wikipédia-szócikk a könyvről)
#   sources        – az összefoglaló forrásai: [{ name, url }]
#   facts          – kiegészítő adatok, ha a Wikidatán hiányoznak:
#                    published, publisher, pages, genres, language, awards
#
# Új könyv után futtasd: npm run fetch

