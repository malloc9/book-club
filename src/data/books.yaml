- title: Egy nő
  author: Esterházy Péter
  englishTitle: She Loves Me
  facts:
    published: "1993"
    publisher: Magvető
    language: magyar
    genres: [regény]
  description:
    - >-
      Esterházy Péter műfajilag nehezen besorolható regénye 97 rövid, számozott fejezetből áll.
      Mindegyik ugyanazzal a gesztussal indul – van egy nő, aki szeret vagy gyűlöl –, és mindegyik egy
      újabb nő, egy újabb kapcsolat pillanatképe. A cím így egyszerre szól egy nőről, sok nőről, és
      arról a férfiról, aki elképzeli őket.
    - >-
      A könyv a testről, az érzékiségről, a vágyról és a férfi–nő kapcsolatok kusza egyszerűségéről szól.
      Esterházyra jellemzően nem hagyományos történetet mesél: villanásokat, reflexiókat ad, a nyelvvel
      és a formával játszik, gyakran humorral, így olvasása inkább egy vers- vagy esszékötet
      lapozgatására emlékeztet.
    - >-
      Először 1993-ban jelent meg a Magvetőnél, azóta több mint egy tucat kiadást ért meg, és számos
      nyelvre lefordították (angolul She Loves Me, franciául Une femme, olaszul Una donna címmel).
      A kritika egy része eleinte mellékműnek tekintette, Nádas Péter viszont nagy könyvnek nevezte.
  sources:
    - { name: "Moly – Egy nő (kiadások, fülszöveg)", url: "https://moly.hu/konyvek/esterhazy-peter-egy-no" }
    - { name: "Store norske leksikon – Péter Esterházy", url: "https://snl.no/P%C3%A9ter_Esterh%C3%A1zy" }

