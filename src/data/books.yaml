- title: Rémtörténetek
  author: Nádas Péter
  cover: covers/remtortenetek.jpg
  coverSource: { name: "Moly", url: "https://moly.hu/konyvek/nadas-peter-remtortenetek" }
  facts:
    published: "2022"
    publisher: Jelenkor
    pages: 464
    language: magyar
    genres: [regény]
    awards: [Merítés-díj (2023)]
  description:
    - >-
      Nádas Péter 2022-ben megjelent regénye egy vízparti, a külvilágtól elzárkózó falu hétköznapjaiba
      visz, a háttérben az 1950–60-as évek politikai rendszerével és életérzésével. A szereplők a falu
      jellegzetes alakjai: gazdák és napszámosok, a katolikus pap és a református lelkész, a községi pásztor
      és szellemileg sérült lánya, a tanító, egy évtizedek óta megbélyegzett öregasszony, egy ördögtől
      megszállottnak tartott péksegéd, egy diáklány, kitelepített arisztokraták és nyaraló úriasszonyok –
      no meg a kísértő szellemek.
    - >-
      A mindössze néhány napot átfogó cselekmény a kiszolgáltatottság, a függőség és az erőszak újabb és
      újabb formáit mutatja meg; a sűrűn váltakozó nyelvi regiszterek és nézőpontok lassan sodorják a
      szereplőket a közös végzet felé. Nádas egy interjúban az elszigeteltséget, az emberi egyenlőtlenséget,
      a kirekesztést és a jóságot kiszorító agressziót nevezte meg a könyv fő kérdéseiként; az alapötlet
      még az 1970-es évekre nyúlik vissza.
    - >-
      A 464 oldalas regény a Jelenkor Kiadónál jelent meg, és 2023-ban Merítés-díjat kapott.
  sources:
    - { name: "Moly – Rémtörténetek (kiadások, fülszöveg)", url: "https://moly.hu/konyvek/nadas-peter-remtortenetek" }
    - { name: "Telex – interjú Nádas Péterrel", url: "https://telex.hu/kult/2022/05/21/nadas-peter-veiszer-alinda-interju" }

