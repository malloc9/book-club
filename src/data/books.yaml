- title: Hangyaboly
  author: Kaffka Margit
  facts:
    published: "1917"
    publisher: Nyugat, Budapest
    language: magyar
    genres: [regény]
  description:
    - >-
      Kaffka Margit 1917-ben, a Nyugat kiadásában megjelent regénye egy apácazárdában játszódik
      a 20. század elején, ahol a nővérek mellett bentlakó növendékek, tanítóképzős lányok és bejáró
      diákok élnek. A regény igazi főszereplője maga a zárda, a „hangyaboly”: sok egymás mellett
      nyüzsgő, egymásba gabalyodó sors.
    - >-
      A beteg főnökasszony utódlása körül csendes hatalmi harc indul. A becsvágyó, modernizáló Virginia
      nővér nyitottabb, állami támogatással működő intézményt szeretne, a szigorú, német származású
      Kunigunda nővér a régi rendet őrzi. Közben a növendékek titkos szerelmekről, flörtökről és a felnőtt
      élet ígéreteiről suttognak, a főnökasszony gazdag, árva unokahúga, Helénke körül pedig érdekek
      gyűrűznek.
    - >-
      Kaffka a saját diákéveit idézi fel, amelyeket az irgalmas nővérek tanítóképzőjében töltött, és
      nyíltan szembefordul a bigott, elmaradott vallásos neveléssel. A könyv megjelenésekor nagy
      közönségsikert aratott; ma szabadon olvasható a Project Gutenbergen.
  sources:
    - { name: "Project Gutenberg – Hangyaboly (teljes szöveg)", url: "https://www.gutenberg.org/ebooks/63531" }
    - { name: "MEK – Kaffka Margit összes költeménye (fülszöveg)", url: "https://mek.oszk.hu/00700/00710/fulszoveg.html" }
    - { name: "Wikipédia – Kaffka Margit", url: "https://hu.wikipedia.org/wiki/Kaffka_Margit" }

- title: Zsömle odavan
  author: Krasznahorkai László
  cover: covers/zsomle-odavan.jpg
  coverSource: { name: "Magvető", url: "https://magveto.hu/konyvek/zsomle-odavan/139511807" }
  facts:
    published: "2024. január 3."
    publisher: Magvető
    pages: 240
    language: magyar
    genres: [regény, szatíra]
  description:
    - >-
      Kada Józsi bácsi kilencvenegy éves nyugalmazott villanyszerelő egy névtelen, többségében
      szlovákok lakta észak-magyarországi faluban. Özvegy, a családjától eltávolodott, egyetlen
      hűséges társa Zsömle nevű házőrző kutyája. Van azonban egy titka: meggyőződése szerint
      IV. Béla és Dzsingisz kán leszármazottjaként ő, Árpád-házi I. József a magyar trón jogos örököse.
    - >-
      Amikor a titok kitudódik, különös, többnyire szélsőjobboldali követők gyűlnek köré – köztük a
      királyság visszaállításáról ábrándozó monarchista és félkatonai akciókat tervező alakok –, akik
      egészen a házelnökig próbálják eljuttatni az ügyét. Józsi bácsi közben elképesztő történeteket mesél
      magáról: Horthy titokban királlyá koronázta, a háborúban megmentette Szolnokot, és ő tanította
      úszni Johnny Weissmüllert. Sokáig nyitva marad, valódi trónörökös-e, szélhámos, vagy csak egy
      összezavarodott öregember.
    - >-
      A kiadó groteszk és szatirikus regényként ajánlja, amely New York, Dalmácia és Türingia után egy
      karneválszerű Magyarországra tér vissza; a történetben egy Krasznahorkai László nevű vándorzenész
      is felbukkan. Bak Róbert a Telexen azt írta, hogy a szatirikus felszín alatt valójában tragédia rejlik:
      a 21. századi ember mély magánya és a közösség szétesése; és bár a regény nem éri el a szerző
      legjobb műveit, Krasznahorkai ma is pontosan érti a világot.
  sources:
    - { name: "Magvető – Zsömle odavan (kiadói oldal)", url: "https://magveto.hu/konyvek/zsomle-odavan/139511807" }
    - { name: "Telex – Bak Róbert kritikája", url: "https://telex.hu/kult/2024/01/10/krasznahorkai-laszlo-zsomle-odavan-regeny-kritika" }

